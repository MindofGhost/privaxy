[package]
name = "web_frontend"
version = "0.1.0"
edition = "2021"

[features]
default = ["tauri-backend"]
tauri-backend = ["tauri-sys"]
web-backend = ["gloo-net"]

[dependencies]
yew = "0.19.3"
yew-router = "0.16.0"
serde_json = "1.0.81"
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", rev = "0c864ee8c2b7d2eb44add60ca7973c9f2454f899", optional = true, features = [
  "dialog",
  "event",
  "tauri",
] }
gloo-net = { version = "0.2.6", optional = true }
num-format = "0.4.0"
serde = { version = "1.0.137", features = ["derive"] }
gloo-utils = "0.1.3"
wasm-bindgen = "0.2.89"
wasm-bindgen-futures = "0.4.39"
futures = "0.3.21"
log = "0.4.17"
wasm-logger = "0.2.0"
gloo-timers = { version = "0.2.4", features = ["futures"] }
serde-tuple-vec-map = "1.0.1"
wee_alloc = "0.4.5"
web-sys = { version = "0.3.66", features = [
  "Document",
  "EventSource",
  "HtmlHeadElement",
  "Element",
  "MessageEvent",
  "NamedNodeMap",
  "Window",
] }
